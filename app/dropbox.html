<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Scribe · Dropbox</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #efe0b9; color: #2b1d14;
      font: 18px/1.4 Georgia, "Times New Roman", serif; text-align: center; padding: 24px; box-sizing: border-box; }
    @media (prefers-color-scheme: dark) { body { background: #1c140e; color: #f1e2c0; } }
    h1 { font-weight: 400; color: #7a1f2b; margin: 0 0 8px; }
    @media (prefers-color-scheme: dark) { h1 { color: #e7b45a; } }
  </style>
</head>
<body>
  <main>
    <h1>❦ Music Scribe</h1>
    <p id="msg">Finishing Dropbox sign-in…</p>
  </main>
  <script>
    // Dropbox sends the browser back here after sign-in; hand the result to the Music Scribe window.
    (function () {
      var p = new URLSearchParams(location.search);
      var msg = { type: 'ms-dropbox', code: p.get('code'), state: p.get('state'), error: p.get('error_description') || p.get('error') };
      try { localStorage.setItem('musicScribe.dropboxReturn', JSON.stringify(msg)); } catch (e) { /* storage off */ }
      try { if (window.opener) window.opener.postMessage(msg, location.origin); } catch (e) { /* opener gone */ }
      document.getElementById('msg').textContent = msg.code
        ? 'Dropbox is connected. You can close this window and go back to Music Scribe.'
        : 'Dropbox sign-in didn’t finish: ' + (msg.error || 'cancelled') + '. Close this window and try again.';
      if (window.opener && msg.code) setTimeout(function () { window.close(); }, 600);
    })();
  </script>
</body>
</html>
